
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mctbs-app
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mctbs-network

  db:
    image: mariadb:10.11
    container_name: mctbs-db
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - mctbs-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mctbs-network

volumes:
  mctbs-db-data:

networks:
  mctbs-network:
    driver: bridge
